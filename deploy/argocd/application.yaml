apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-fraud-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lumiflarez/fraud-detection-final.git
    targetRevision: main
    path: deploy/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true